# netlify.toml — RetireMeHere.com
# Goal: keep internal markdown (methodology, scoring analysis, session logs)
# in the GitHub repo and versioned, but NOT reachable on the public site.
#
# Convention: put every internal .md file under /docs in the repo.
#   /docs/GUIDE-METHODOLOGY-DECISIONS.md
#   /docs/healthcare-cities-scoring-analysis.md
#   /docs/SESSION-LOG-2026-06-07.md   ... etc.
#
# The redirect below intercepts any request to /docs/* and returns the 404
# page before the file is served. force = true makes it win even though the
# file physically exists in the publish output.

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# If you ever keep a stray .md at the repo root instead of /docs, this second
# rule blocks markdown anywhere. (Safe to keep both.)
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

# --- Canonical URL form: .html wins -----------------------------------------
# Netlify serves every page at two addresses, with and without .html, and
# Google indexed both forms for three pages (found in the 2026-08-17 Search
# Console read: naples-vs-sarasota, pensacola-vs-fort-myers,
# visit-before-you-decide). Canonical tags, og:url, the sitemap and every
# internal link already use .html, so the .html form is the one that wins and
# extensionless traffic 301s to it.
#
# ROOT SAFETY, tested reasoning: the homepage carries the quiz redirect and
# must never be caught. `/:page` is a single-segment placeholder that requires
# a NON-EMPTY segment, so it cannot match `/`. Neither rule uses force, so any
# request whose path matches a real deployed file (/favicon.ico,
# /site.webmanifest, /scouting-trip-workbook.pdf, every .html page itself) is
# served as-is and the redirect never fires. Only pathnames that match no file
# reach these rules, which is exactly the extensionless set.
#
# Query strings pass through Netlify redirects unchanged, so a stray
# /index?city=NAME&state=ST still lands on /index.html?city=... and routes.

[[redirects]]
  from = "/:page"
  to = "/:page.html"
  status = 301

# Same form one level down, for profile URLs. Not yet observed in Search
# Console, but it is the identical defect and the rule above cannot reach it.
[[redirects]]
  from = "/cities/:slug/profile"
  to = "/cities/:slug/profile.html"
  status = 301

# --- Notes ---
# 1. This hides the files from normal web access. It is not encryption; the
#    repo itself is where access control lives (keep the repo private if the
#    docs are sensitive).
# 2. Requires a /404.html in your publish directory. If you don't have one,
#    Netlify serves its default 404, which also works — you can change `to`
#    to any existing page.
# 3. If you already have a netlify.toml, merge just the [[redirects]] blocks
#    above into it rather than replacing your file (don't lose existing
#    build/headers settings).
